name: Build Lume unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "Xcode_26.6.app is not installed on this runner."
            echo "Available Xcode installations:"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          xcodebuild -version

      - name: Checkout required sibling packages
        shell: bash
        run: |
          set -euo pipefail

          PARENT_DIR="$(cd "$GITHUB_WORKSPACE/.." && pwd)"

          echo "Repository workspace: $GITHUB_WORKSPACE"
          echo "Sibling package directory: $PARENT_DIR"

          git clone --depth 1 --branch main \
            https://github.com/bilipp/LumeEngine.git \
            "$PARENT_DIR/LumeEngine"

          git clone --depth 1 --branch main \
            https://github.com/bilipp/LumeCloud.git \
            "$PARENT_DIR/LumeCloud"

          git clone --depth 1 --branch main \
            https://github.com/bilipp/LumeRecorder.git \
            "$PARENT_DIR/LumeRecorder"

          test -f "$PARENT_DIR/LumeEngine/Package.swift"
          test -f "$PARENT_DIR/LumeCloud/LumeCloudKit/Package.swift"
          test -f "$PARENT_DIR/LumeRecorder/Kit/Package.swift"

          echo "Verified required local packages:"
          echo "  $PARENT_DIR/LumeEngine"
          echo "  $PARENT_DIR/LumeCloud/LumeCloudKit"
          echo "  $PARENT_DIR/LumeRecorder/Kit"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project Lume.xcodeproj \
            -scheme Lume \
            -derivedDataPath build/DerivedData

      - name: Patch upstream AetherEngine benchmark code
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import glob
          import os
          import stat
          import sys

          files = glob.glob(
              "build/DerivedData/SourcePackages/checkouts/**/PerFrameBenchmark.swift",
              recursive=True,
          )

          if not files:
              sys.exit(
                  "Could not find PerFrameBenchmark.swift in the resolved Swift packages."
              )

          replacement = """        let sliceLength = sliceBytes / 4
              var sliceNALs: [[UInt8]] = []
              sliceNALs.reserveCapacity(4)

              for i in 0 ..< 4 {
                  var slice: [UInt8] = [19 << 1, 1]
                  slice.reserveCapacity(sliceLength + 2)

                  for j in 0 ..< sliceLength {
                      let value = UInt8(truncatingIfNeeded: j &* 7 &+ i)
                      slice.append((0x11 &+ value) | 1)
                  }

                  sliceNALs.append(slice)
              }

              var nals: [[UInt8]] = [[35 << 1, 1, 0x50], sei]
              nals.append(contentsOf: sliceNALs)

              var totalSize = 0
              for nal in nals {
                  totalSize += 4 + nal.count
              }

              var packet: [UInt8] = []
              packet.reserveCapacity(totalSize)

              for nal in nals {
                  let length = nal.count
                  packet.append(UInt8((length >> 24) & 0xFF))
                  packet.append(UInt8((length >> 16) & 0xFF))
                  packet.append(UInt8((length >> 8) & 0xFF))
                  packet.append(UInt8(length & 0xFF))
                  packet.append(contentsOf: nal)
              }

              return packet"""

          start_marker = "        let nals: [[UInt8]] ="
          end_marker = "\n    }\n\n    private static func deviceName()"

          old_median = """            let sorted = steps.map { $0[keyPath: key] }.sorted()
              return sorted.isEmpty ? 0 : sorted[sorted.count / 2] * 1000"""

          new_median = """            var values: [Double] = []
              values.reserveCapacity(steps.count)
              for step in steps {
                  values.append(step[keyPath: key])
              }
              values.sort()
              return values.isEmpty ? 0 : values[values.count / 2] * 1000"""

          for path in files:
              with open(path, encoding="utf-8") as source:
                  text = source.read()

              changed = False

              # Patch the upstream NAL construction if it has not already
              # been patched.
              if "var totalSize = 0" not in text or "sliceNALs.reserveCapacity(4)" not in text:
                  start = text.find(start_marker)
                  if start == -1:
                      sys.exit(
                          f"Could not find the expected NAL construction in {path}."
                      )

                  end = text.find(end_marker, start)
                  if end == -1:
                      sys.exit(
                          f"Could not find the end of keyFramePacket() in {path}."
                      )

                  text = text[:start] + replacement + text[end:]
                  changed = True
                  print(f"Patched NAL construction in: {path}")
              else:
                  print(f"NAL construction is already patched: {path}")

              # Avoid capturing the key path in steps.map's actor-isolated
              # closure. A normal loop keeps the access in this function.
              if old_median in text:
                  text = text.replace(old_median, new_median, 1)
                  changed = True
                  print(f"Patched Swift 6 actor-isolation code in: {path}")
              elif "values.append(step[keyPath: key])" in text:
                  print(f"Actor-isolation code is already patched: {path}")
              else:
                  sys.exit(
                      f"Could not find the expected median code in {path}."
                  )

              if changed:
                  current_mode = os.stat(path).st_mode
                  os.chmod(path, current_mode | stat.S_IWUSR)

                  with open(path, "w", encoding="utf-8") as output:
                      output.write(text)
          PY

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild build \
            -project Lume.xcodeproj \
            -scheme Lume \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Lume.app"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected app bundle was not found: $APP_PATH"
            find build/DerivedData/Build/Products -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi

          rm -rf Payload Lume-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Lume-unsigned.ipa
          ls -lh Lume-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lume-unsigned-ipa
          path: Lume-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
