name: Build Lume unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "Xcode_26.6.app is not installed on this runner."
            echo "Available Xcode installations:"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          xcodebuild -version

      - name: Prepare missing local package stubs
        shell: bash
        run: |
          set -euo pipefail

          write_pkg() {
            local dir="$1"
            local pkg_name="$2"
            local product_name="$3"

            if [[ -f "$dir/Package.swift" ]]; then
              echo "Using existing package: $dir"
              return
            fi

            mkdir -p "$dir/Sources/$product_name"
            cat > "$dir/Package.swift" <<EOF
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "$pkg_name",
              platforms: [.iOS(.v16), .macOS(.v13)],
              products: [
                  .library(name: "$product_name", targets: ["$product_name"])
              ],
              targets: [
                  .target(name: "$product_name")
              ]
          )
          EOF
            touch "$dir/Sources/$product_name/Placeholder.swift"
            echo "Created package stub: $dir"
          }

          write_pkg "../LumeRecorder/Kit" "Kit" "LumeRecorderKit"
          write_pkg "LumeRecorder/Kit" "Kit" "LumeRecorderKit"
          write_pkg "../LumeCloud/LumeCloudKit" "LumeCloudKit" "LumeCloudKit"
          write_pkg "LumeCloud/LumeCloudKit" "LumeCloudKit" "LumeCloudKit"
          write_pkg "../LumeEngine" "LumeEngine" "LumeEngine"
          write_pkg "LumeEngine" "LumeEngine" "LumeEngine"

          # Create a minimal stub for any other missing sibling package paths
          # referenced by the project. Existing package manifests are preserved.
          python3 - <<'PY'
          import os
          import re

          pattern = re.compile(r'path:\s*"(\.\./[^"]+)"')
          referenced_paths = set()

          for root, dirs, files in os.walk("."):
              dirs[:] = [directory for directory in dirs if directory not in {".git", "build"}]
              for filename in files:
                  if not filename.endswith((".pbxproj", ".swift", "Package.swift")):
                      continue

                  path = os.path.join(root, filename)
                  try:
                      with open(path, encoding="utf-8", errors="ignore") as source:
                          referenced_paths.update(
                              os.path.normpath(match) for match in pattern.findall(source.read())
                          )
                  except OSError:
                      pass

          for package_path in sorted(referenced_paths):
              if os.path.isfile(os.path.join(package_path, "Package.swift")):
                  continue

              package_name = os.path.basename(package_path)
              source_dir = os.path.join(package_path, "Sources", package_name)
              os.makedirs(source_dir, exist_ok=True)

              manifest = f'''// swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "{package_name}",
              platforms: [.iOS(.v16), .macOS(.v13)],
              products: [
                  .library(name: "{package_name}", targets: ["{package_name}"])
              ],
              targets: [
                  .target(name: "{package_name}")
              ]
          )
          '''
              with open(os.path.join(package_path, "Package.swift"), "w", encoding="utf-8") as output:
                  output.write(manifest)

              open(os.path.join(source_dir, "Placeholder.swift"), "a").close()
              print(f"Created package stub: {package_path}")
          PY

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project Lume.xcodeproj \
            -scheme Lume \
            -derivedDataPath build/DerivedData

      - name: Patch upstream AetherEngine benchmark code
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import glob
          import os
          import stat
          import sys

          files = glob.glob(
              "build/DerivedData/SourcePackages/checkouts/**/PerFrameBenchmark.swift",
              recursive=True,
          )

          if not files:
              sys.exit(
                  "Could not find PerFrameBenchmark.swift in the resolved Swift packages."
              )

          replacement = """        let sliceLength = sliceBytes / 4
                  var sliceNALs: [[UInt8]] = []
                  sliceNALs.reserveCapacity(4)

                  for i in 0 ..< 4 {
                      var slice: [UInt8] = [19 << 1, 1]
                      slice.reserveCapacity(sliceLength + 2)

                      for j in 0 ..< sliceLength {
                          let value = UInt8(truncatingIfNeeded: j &* 7 &+ i)
                          slice.append((0x11 &+ value) | 1)
                      }

                      sliceNALs.append(slice)
                  }

                  var nals: [[UInt8]] = [[35 << 1, 1, 0x50], sei]
                  nals.append(contentsOf: sliceNALs)

                  var totalSize = 0
                  for nal in nals {
                      totalSize += 4 + nal.count
                  }

                  var packet: [UInt8] = []
                  packet.reserveCapacity(totalSize)

                  for nal in nals {
                      let length = nal.count
                      packet.append(UInt8((length >> 24) & 0xFF))
                      packet.append(UInt8((length >> 16) & 0xFF))
                      packet.append(UInt8((length >> 8) & 0xFF))
                      packet.append(UInt8(length & 0xFF))
                      packet.append(contentsOf: nal)
                  }

                  return packet"""

          start_marker = "        let nals: [[UInt8]] ="
          end_marker = "\n    }\n\n    private static func deviceName()"

          for path in files:
              with open(path, encoding="utf-8") as source:
                  text = source.read()

              if "var totalSize = 0" in text and "sliceNALs.reserveCapacity(4)" in text:
                  print(f"Benchmark code is already patched: {path}")
                  continue

              start = text.find(start_marker)
              if start == -1:
                  sys.exit(f"Could not find the expected NAL construction in {path}.")

              end = text.find(end_marker, start)
              if end == -1:
                  sys.exit(f"Could not find the end of keyFramePacket() in {path}.")

              patched = text[:start] + replacement + text[end:]

              current_mode = os.stat(path).st_mode
              os.chmod(path, current_mode | stat.S_IWUSR)

              with open(path, "w", encoding="utf-8") as output:
                  output.write(patched)

              print(f"Patched benchmark code for Swift compiler: {path}")
          PY

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild build \
            -project Lume.xcodeproj \
            -scheme Lume \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Lume.app"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected app bundle was not found: $APP_PATH"
            find build/DerivedData/Build/Products -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi

          rm -rf Payload Lume-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Lume-unsigned.ipa
          ls -lh Lume-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lume-unsigned-ipa
          path: Lume-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
