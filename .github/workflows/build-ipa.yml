name: Build Lume IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch local package dependencies
        run: |
          ls -la
          if [ ! -d "LumeRecorder" ]; then
            git clone --depth 1 https://github.com/bilipp/LumeRecorder.git LumeRecorder || true
          fi
          ls -la LumeRecorder 2>/dev/null || true

      - name: Build unsigned iOS app
        run: |
          xcodebuild -list -json > xcode_list.json
          SCHEME=$(python3 -c "import sys, json; d=json.load(open('xcode_list.json')); p=d.get('project') or d.get('workspace') or {}; schemes=p.get('schemes') or []; print(schemes[0] if schemes else 'Lume')")
          echo "Using scheme: $SCHEME"
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Lume-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lume-ipa
          path: Lume-unsigned.ipa
