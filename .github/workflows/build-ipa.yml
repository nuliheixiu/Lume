name: Build Lume IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Prepare local package stubs
        run: |
          write_pkg() {
            local dir="$1"
            local pkg_name="$2"
            local prod_name="$3"
            mkdir -p "$dir/Sources/$prod_name"
            printf '// swift-tools-version: 5.9\nimport PackageDescription\nlet package = Package(name: "%s", platforms: [.iOS(.v16), .macOS(.v13)], products: [.library(name: "%s", targets: ["%s"])], targets: [.target(name: "%s", path: "Sources/%s")])\n' "$pkg_name" "$prod_name" "$prod_name" "$prod_name" "$prod_name" > "$dir/Package.swift"
            touch "$dir/Sources/$prod_name/Placeholder.swift"
          }

          write_pkg "../LumeRecorder/Kit" "Kit" "LumeRecorderKit"
          write_pkg "LumeRecorder/Kit" "Kit" "LumeRecorderKit"
          write_pkg "../LumeCloud/LumeCloudKit" "LumeCloudKit" "LumeCloudKit"
          write_pkg "LumeCloud/LumeCloudKit" "LumeCloudKit" "LumeCloudKit"
          write_pkg "../LumeEngine" "LumeEngine" "LumeEngine"
          write_pkg "LumeEngine" "LumeEngine" "LumeEngine"

          python3 - << 'PY'
          import os, re

          pattern = re.compile(r'path:\s*"(\.\./[^"]+)"')
          found = set()
          for root, _, files in os.walk("."):
              if ".git" in root or "build" in root:
                  continue
              for fn in files:
                  if fn.endswith((".pbxproj", ".swift", "Package.swift")):
                      p = os.path.join(root, fn)
                      try:
                          txt = open(p, encoding="utf-8", errors="ignore").read()
                          for m in pattern.findall(txt):
                              found.add(os.path.normpath(m))
                      except OSError:
                          pass

          for rel in sorted(found):
              if not os.path.exists(rel):
                  pkg = os.path.basename(rel)
                  os.makedirs(os.path.join(rel, "Sources", pkg), exist_ok=True)
                  with open(os.path.join(rel, "Package.swift"), "w", encoding="utf-8") as f:
                      f.write(f'// swift-tools-version: 5.9\nimport PackageDescription\nlet package = Package(name: "{pkg}", platforms: [.iOS(.v16), .macOS(.v13)], products: [.library(name: "{pkg}", targets: ["{pkg}"])], targets: [.target(name: "{pkg}")])\n')
                  open(os.path.join(rel, "Sources", pkg, "Placeholder.swift"), "w").close()
                  print("Auto-stubbed:", rel)
          PY

      - name: Resolve dependencies and patch PerFrameBenchmark.swift
        run: |
          xcodebuild -list -json > xcode_list.json
          SCHEME=$(python3 - << 'PY'
          import json
          d = json.load(open("xcode_list.json"))
          p = d.get("project") or d.get("workspace") or {}
          schemes = p.get("schemes") or []
          candidates = [s for s in schemes if "test" not in s.lower()] or schemes
          for pref in ["Lume", "Lume-iOS", "Lume iOS"]:
              if pref in candidates:
                  print(pref)
                  break
          else:
              print(candidates[0] if candidates else "Lume")
          PY
          )
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          xcodebuild \
            -resolvePackageDependencies \
            -scheme "$SCHEME" \
            -derivedDataPath build/DerivedData

          python3 - << 'PY'
          import glob

          files = glob.glob("build/DerivedData/SourcePackages/checkouts/**/Sources/AetherEngine/Diagnostics/PerFrameBenchmark.swift", recursive=True)
          for path in files:
              print("Inspecting:", path)
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()

              start = max(0, 370)
              end = min(len(lines), 415)
              for idx in range(start, end):
                  print(f"{idx + 1}: {lines[idx]}", end="")

              # 若第383行附近存在 nals.flatMap { nal in，尝试加上显式返回类型标注缩小推断范围
              for i in range(max(0, 375), min(len(lines), 395)):
                  if "nals.flatMap" in lines[i] and "{" in lines[i] and "->" not in lines[i]:
                      lines[i] = lines[i].replace("{ nal in", "{ (nal: Any) -> [Any] in")
                      with open(path, "w", encoding="utf-8") as f:
                          f.writelines(lines)
                      print(f"Annotated closure at line {i + 1}")
                      break
          PY

      - name: Build unsigned iOS app
        run: |
          echo "Using scheme: $SCHEME"
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Lume-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lume-ipa
          path: Lume-unsigned.ipa
