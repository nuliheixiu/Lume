name: Build Lume IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare local Kit stub
        run: |
          pwd
          for dir in "../LumeRecorder/Kit" "LumeRecorder/Kit"; do
            mkdir -p "$dir/Sources/Kit"
            cat << 'EOF' > "$dir/Package.swift"
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "Kit",
              platforms: [.iOS(.v16), .macOS(.v13)],
              products: [
                  .library(name: "Kit", targets: ["Kit"])
              ],
              targets: [
                  .target(name: "Kit")
              ]
          )
          EOF
            touch "$dir/Sources/Kit/Placeholder.swift"
          done
          ls -la ../LumeRecorder/Kit

      - name: Build unsigned iOS app
        run: |
          xcodebuild -list -json > xcode_list.json
          SCHEME=$(python3 -c "import sys, json; d=json.load(open('xcode_list.json')); p=d.get('project') or d.get('workspace') or {}; schemes=p.get('schemes') or []; print(schemes[0] if schemes else 'Lume')")
          echo "Using scheme: $SCHEME"
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Lume-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lume-ipa
          path: Lume-unsigned.ipa
