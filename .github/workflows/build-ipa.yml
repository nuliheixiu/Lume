name: Build Lume IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare local package stubs
        run: |
          make_stub() {
            local target_dir="$1"
            local pkg_name
            pkg_name=$(basename "$target_dir")
            mkdir -p "$target_dir/Sources/$pkg_name"
            printf '// swift-tools-version: 5.9\nimport PackageDescription\nlet package = Package(name: "%s", platforms: [.iOS(.v16), .macOS(.v13)], products: [.library(name: "%s", targets: ["%s"])], targets: [.target(name: "%s")])\n' "$pkg_name" "$pkg_name" "$pkg_name" "$pkg_name" > "$target_dir/Package.swift"
            touch "$target_dir/Sources/$pkg_name/Placeholder.swift"
            echo "Created stub at: $target_dir (name: $pkg_name)"
          }

          for fixed_dir in "../LumeRecorder/Kit" "LumeRecorder/Kit" "../LumeCloud/LumeCloudKit" "LumeCloud/LumeCloudKit" "../LumeEngine" "LumeEngine"; do
            make_stub "$fixed_dir"
          done

          python3 - << 'PY'
          import os, re

          pattern = re.compile(r'path:\s*"(\.\./[^"]+)"')
          found = set()
          for root, _, files in os.walk("."):
              if ".git" in root or "build" in root:
                  continue
              for fn in files:
                  if fn.endswith((".pbxproj", ".swift", "Package.swift")):
                      p = os.path.join(root, fn)
                      try:
                          txt = open(p, encoding="utf-8", errors="ignore").read()
                          for m in pattern.findall(txt):
                              found.add(os.path.normpath(m))
                      except OSError:
                          pass

          for rel in sorted(found):
              if not os.path.exists(rel):
                  pkg = os.path.basename(rel)
                  os.makedirs(os.path.join(rel, "Sources", pkg), exist_ok=True)
                  with open(os.path.join(rel, "Package.swift"), "w", encoding="utf-8") as f:
                      f.write(f'// swift-tools-version: 5.9\nimport PackageDescription\nlet package = Package(name: "{pkg}", platforms: [.iOS(.v16), .macOS(.v13)], products: [.library(name: "{pkg}", targets: ["{pkg}"])], targets: [.target(name: "{pkg}")])\n')
                  open(os.path.join(rel, "Sources", pkg, "Placeholder.swift"), "w").close()
                  print("Auto-stubbed:", rel)
          PY

      - name: Build unsigned iOS app
        run: |
          xcodebuild -list -json > xcode_list.json
          cat xcode_list.json
          SCHEME=$(python3 - << 'PY'
          import json
          d = json.load(open("xcode_list.json"))
          p = d.get("project") or d.get("workspace") or {}
          schemes = p.get("schemes") or []
          candidates = [s for s in schemes if "test" not in s.lower()] or schemes
          for pref in ["Lume", "Lume-iOS", "Lume iOS"]:
              if pref in candidates:
                  print(pref)
                  break
          else:
              print(candidates[0] if candidates else "Lume")
          PY
          )
          echo "Using scheme: $SCHEME"
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Lume-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lume-ipa
          path: Lume-unsigned.ipa
